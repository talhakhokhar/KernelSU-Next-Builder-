name: Universal Kernel Builder + KernelSU-Next (Stable) + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source URL"
        required: true
        default: "https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "sixteen-qpr2"
      defconfig:
        description: "Defconfig path"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      anykernel:
        type: boolean
        default: true
      anykernel_repo:
        required: false
        default: "https://github.com/osm0sis/AnyKernel3.git"
      anykernel_branch:
        required: false
        default: "master"
      zip_name:
        default: "Kernel-KSU-Next-SUSFS"
      developer:
        default: "builder"
      enable_kernelsu_next:
        type: boolean
        default: true
      enable_susfs:
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT: out

    steps:
      # 1. Dependencies
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git curl zip build-essential bc bison flex libssl-dev libelf-dev python3

      # 2. Clone kernel
      - name: Clone kernel
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source }}" kernel

      # 3. Clean previous build artefacts
      - name: Clean source tree
        run: |
          cd kernel
          make ARCH=arm64 mrproper || true
          rm -rf out

      # 4. Setup Clang toolchain
      - name: Setup clang
        run: |
          mkdir clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-dev/clang-r487747c.tar.gz | tar -xz -C clang

      # 5. Inject KernelSU-Next
      - name: Inject KernelSU-Next
        if: ${{ inputs.enable_kernelsu_next }}
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh | bash -s legacy

      # 6. Base configuration
      - name: Configure kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make O=out ${{ inputs.defconfig }}

      # 7. Merge vendor fragment (with cleanup)
      - name: Merge vendor config
        run: |
          cd kernel
          if [ -f arch/arm64/configs/vendor/oplus_yupik_QGKI.config ]; then
            scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/vendor/oplus_yupik_QGKI.config
            rm -f .config
          fi
          make O=out olddefconfig

      # 8. Integrate SUSFS (handles symlinked KernelSU)
      - name: Integrate SUSFS
        if: ${{ inputs.enable_susfs }}
        run: |
          cd kernel
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 susfs4ksu --depth=1

          # Determine actual KernelSU directory (may be a symlink)
          KSU_DIR="KernelSU"
          if [ -L "$KSU_DIR" ]; then
            KSU_DIR=$(readlink -f "$KSU_DIR")
          fi
          echo "Using KernelSU directory: $KSU_DIR"

          # Copy and apply the KSU‑specific SUSFS patch
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_DIR/"
          cd "$KSU_DIR" && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..

          # Apply the main kernel-wide SUSFS patch (for 5.4)
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch

          # Copy filesystem and header files
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Clean up the SUSFS source to avoid polluting the kernel tree
          rm -rf susfs4ksu

      # 9. Enable SUSFS features in the kernel config
      - name: Enable SUSFS config
        if: ${{ inputs.enable_susfs }}
        run: |
          cd kernel
          scripts/config --file out/.config \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT
          make O=out olddefconfig

      # 10. Build kernel (including dtbo)
      - name: Build kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make -j$(nproc) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz dtbs dtbo.img 2>&1 | tee build.log

      # 11. Package with AnyKernel3
      - name: Package AnyKernel3
        if: ${{ inputs.anykernel }}
        run: |
          git clone -b "${{ inputs.anykernel_branch }}" "${{ inputs.anykernel_repo }}" ak3
          rm -rf ak3/.git
          IMG=kernel/out/arch/arm64/boot
          cp $IMG/Image* ak3/ 2>/dev/null || true
          cp $IMG/dtbo.img ak3/ 2>/dev/null || true
          cd ak3
          zip -r "../${{ inputs.zip_name }}-${{ inputs.developer }}.zip" .

      # 12. Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            *.zip
            kernel/build.log
            kernel/out/arch/arm64/boot/Image*
