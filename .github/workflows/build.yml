name: Universal Kernel Builder + KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8350'

      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'sixteen-qpr2'

      defconfig:
        description: 'Defconfig'
        required: true
        default: 'vendor/lahaina-qgki_defconfig'

      anykernel:
        description: 'Use AnyKernel3'
        required: true
        type: boolean
        default: true

      anykernel_repo:
        required: false
        default: 'https://github.com/osm0sis/AnyKernel3.git'

      anykernel_branch:
        required: false
        default: 'master'

      zip_name:
        required: false
        default: 'Kernel-KSU-Next'

      developer:
        required: false
        default: 'builder'

      enable_kernelsu_next:
        required: true
        type: boolean
        default: true


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Toolchain
        run: |
          sudo apt update
          sudo apt install -y git curl zip build-essential bc bison flex libssl-dev

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-gcc
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-gcc

          mkdir clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android14-dev/clang-r487747c.tar.gz | tar -xz -C clang

      - name: Clone Kernel
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source }}" kernel

      - name: KernelSU-Next Inject
        if: ${{ inputs.enable_kernelsu_next }}
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s legacy

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

          ARGS="ARCH=arm64 \
          O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1"

          cd kernel

          make $ARGS ${{ inputs.defconfig }}

          # merge vendor fragment safely (ignore warnings)
          if [ -f arch/arm64/configs/vendor/oplus_yupik_QGKI.config ]; then
            scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/vendor/oplus_yupik_QGKI.config || true
          fi

          scripts/config --file out/.config \
            -e OVERLAY_FS \
            -e TMPFS_XATTR

          make $ARGS olddefconfig

          echo "Starting build..."
          make -j$(nproc) $ARGS Image.gz dtbs 2>&1 | tee build.log

      - name: Verify Build Output
        run: |
          echo "Kernel output:"
          ls -lah kernel/out/arch/arm64/boot/

          if ! ls kernel/out/arch/arm64/boot/Image* 1> /dev/null 2>&1; then
            echo "❌ Kernel Image not found!"
            exit 1
          fi

      - name: Package AnyKernel
        if: ${{ inputs.anykernel }}
        run: |
          git clone --depth=1 -b "${{ inputs.anykernel_branch }}" "${{ inputs.anykernel_repo }}" AnyKernel3

          rm -rf AnyKernel3/.git

          IMG_DIR=kernel/out/arch/arm64/boot

          for img in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f "$IMG_DIR/$img" ]; then
              cp "$IMG_DIR/$img" AnyKernel3/
              KERNEL_IMG=$img
              break
            fi
          done

          if [ -z "$KERNEL_IMG" ]; then
            echo "❌ No kernel image found!"
            exit 1
          fi

          cd AnyKernel3
          ZIP="${{ inputs.zip_name }}-${{ inputs.developer }}-$(date +%Y%m%d-%H%M).zip"
          zip -r "../$ZIP" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.developer }}
          path: |
            *.zip
            kernel/out/arch/arm64/boot/Image*
